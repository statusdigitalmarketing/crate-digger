name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: ./scripts/package-release.sh
      - name: MCP handshake from the packaged zip
        run: |
          mkdir -p /tmp/clean && cd /tmp/clean && unzip -q "$GITHUB_WORKSPACE/release/crate-digger.zip"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' '{"jsonrpc":"2.0","method":"notifications/initialized"}' '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' > in.jsonl
          (cat in.jsonl; sleep 3) | node crate-digger/crate-digger.mjs > out.jsonl
          cat out.jsonl
          grep -q '"classify_track"' out.jsonl && grep -q '"search_by_mood"' out.jsonl
